services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: bgt
      POSTGRES_PASSWORD: bgt
      POSTGRES_DB: bgt
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bgt -d bgt"]
      interval: 2s
      retries: 30
  # Idempotent, so it also works on an existing volume. GoTrue owns its own schema and role.
  auth-init:
    image: postgres:17
    depends_on:
      db: { condition: service_healthy }
    environment: { PGPASSWORD: bgt }
    entrypoint: ["psql", "-h", "db", "-U", "bgt", "-d", "bgt", "-v", "ON_ERROR_STOP=1", "-f", "/init-auth.sql"]
    volumes: ["./init-auth.sql:/init-auth.sql:ro"]
  # Local stand-in for Supabase Auth (GoTrue); the cloud project replaces it outside dev/CI.
  auth:
    image: supabase/gotrue:v2.158.1
    depends_on:
      auth-init: { condition: service_completed_successfully }
      mailpit: { condition: service_started }
    ports: ["9999:9999"]
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      PORT: "9999"
      API_EXTERNAL_URL: http://localhost:9999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:bgt@db:5432/bgt?search_path=auth
      GOTRUE_SITE_URL: http://localhost:8081
      GOTRUE_URI_ALLOW_LIST: http://localhost:8081/**
      GOTRUE_JWT_SECRET: ${AUTH_JWT_SECRET:-dev-only-secret-dev-only-secret-32b}
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_SMTP_HOST: mailpit
      GOTRUE_SMTP_PORT: "1025"
      GOTRUE_SMTP_ADMIN_EMAIL: noreply@bgt.local
      # Local only: the default limits (one email per minute per user) would make e2e flaky.
      GOTRUE_SMTP_MAX_FREQUENCY: 1s
      GOTRUE_RATE_LIMIT_EMAIL_SENT: "1000"
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOOGLE_ENABLED:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: http://localhost:9999/callback
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9999/health"]
      interval: 2s
      retries: 30
  mailpit:
    image: axllent/mailpit:v1.21
    ports: ["1025:1025", "8025:8025"]
volumes:
  pgdata:

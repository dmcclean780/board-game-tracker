[package]
name = "bgt-db-integration"
version = "0.1.0"
edition = "2021"
publish = false

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "migrate"] }
testcontainers-modules = { version = "0.11", features = ["postgres"] }

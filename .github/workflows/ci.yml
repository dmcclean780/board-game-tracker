name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: backend unit, targets: "backend:test-ci", cargo-tools: "cargo-llvm-cov,cargo-nextest" }
          - { name: backend integration, targets: "backend:integration-ci", cargo-tools: "cargo-llvm-cov,cargo-nextest" }
          - { name: frontend typecheck, targets: "frontend:typecheck", cargo-tools: "" }
          - { name: frontend unit, targets: "frontend:test-ci", cargo-tools: "" }
          - { name: frontend e2e, targets: "frontend:e2e-ci", cargo-tools: "" }
    uses: ./.github/workflows/moon-ci.yml
    with:
      name: ${{ matrix.name }}
      targets: ${{ matrix.targets }}
      cargo-tools: ${{ matrix.cargo-tools }}

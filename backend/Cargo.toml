[workspace]
members = [".", "games/core", "games/root", "games/arcs", "games/old-kings-crown"]

[package]
name = "bgt-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "migrate", "uuid", "chrono", "json"] }
bgt-games = { path = "games/core" }
bgt-game-root = { path = "games/root" }
bgt-game-arcs = { path = "games/arcs" }
bgt-game-old-kings-crown = { path = "games/old-kings-crown" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
utoipa = { version = "5", features = ["uuid", "chrono"] }
uuid = { version = "1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tower-http = { version = "0.6", features = ["cors"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1", features = ["v4"] }
http-body-util = "0.1"
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
